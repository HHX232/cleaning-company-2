<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1240" width="1240" height="1240" role="img" aria-label="Специализированный клининг">
  <title>Специализированный клининг</title>

  <defs>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"  stop-color="#2f9e5b"/>
      <stop offset="55%" stop-color="#1d5e39"/>
      <stop offset="100%" stop-color="#152318"/>
    </linearGradient>
    <linearGradient id="towerDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#1f6b3f"/>
      <stop offset="100%" stop-color="#152318"/>
    </linearGradient>
    <linearGradient id="towerMid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#2f9e5b"/>
      <stop offset="100%" stop-color="#1b5636"/>
    </linearGradient>
    <linearGradient id="towerLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#5fc98c"/>
      <stop offset="100%" stop-color="#2f9e5b"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#1f6b3f"/>
      <stop offset="100%" stop-color="#152318"/>
    </linearGradient>
    <linearGradient id="waveTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#2f9e5b"/>
      <stop offset="100%" stop-color="#5fc98c"/>
    </linearGradient>
    <linearGradient id="waveBottom" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#1b5636"/>
      <stop offset="100%" stop-color="#2f9e5b"/>
    </linearGradient>
  </defs>

  <rect width="1240" height="1240" fill="#ffffff"/>

  <!-- ==== ЭМБЛЕМА ==== -->
  <g>
    <!-- разомкнутое кольцо-волна: широкое вверху, сходится в острые хвосты -->
    <path d="M 425 632 A 232 232 0 1 1 831 443 A 226 226 0 1 0 425 632 Z"
          fill="url(#ring)"/>

    <!-- блики / искры -->
    <g fill="#5fc98c">
      <path d="M 545 330 C 553 380 563 390 606 400 C 563 410 553 420 545 470 C 537 420 527 410 484 400 C 527 390 537 380 545 330 Z"/>
      <path d="M 497 424 C 502 452 508 458 532 464 C 508 470 502 476 497 504 C 492 476 486 470 462 464 C 486 458 492 452 497 424 Z" opacity=".9"/>
      <path d="M 580 316 C 583 333 586 336 600 340 C 586 344 583 347 580 364 C 577 347 574 344 560 340 C 574 336 577 333 580 316 Z" opacity=".8"/>
    </g>

    <!-- волны: подняты и уходят за здания -->
    <g transform="translate(0,-62)">
      <path d="M 428 692
               C 552 800 724 792 836 684
               C 898 624 946 596 994 582
               C 946 612 902 646 844 712
               C 726 838 548 826 428 692 Z"
            fill="url(#waveTop)"/>
      <path d="M 462 754
               C 592 834 762 806 872 694
               C 916 648 950 626 992 612
               C 950 650 922 674 880 722
               C 762 848 584 866 462 754 Z"
            fill="url(#waveBottom)"/>
    </g>

    <!-- здания -->
    <path d="M 780 452 L 862 452 L 862 645 L 780 645 Z" fill="url(#towerLight)"/>
    <g fill="#ffffff" opacity=".85">
      <rect x="794" y="474" width="16" height="30" rx="2"/><rect x="822" y="474" width="16" height="30" rx="2"/>
      <rect x="794" y="518" width="16" height="30" rx="2"/><rect x="822" y="518" width="16" height="30" rx="2"/>
      <rect x="794" y="562" width="16" height="30" rx="2"/><rect x="822" y="562" width="16" height="30" rx="2"/>
      <rect x="794" y="606" width="16" height="30" rx="2"/><rect x="822" y="606" width="16" height="30" rx="2"/>
    </g>
    <path d="M 704 356 L 776 356 L 776 645 L 704 645 Z" fill="url(#towerMid)"/>
    <g fill="#ffffff" opacity=".92">
      <rect x="718" y="378" width="18" height="34" rx="2"/><rect x="746" y="378" width="18" height="34" rx="2"/>
      <rect x="718" y="428" width="18" height="34" rx="2"/><rect x="746" y="428" width="18" height="34" rx="2"/>
      <rect x="718" y="478" width="18" height="34" rx="2"/><rect x="746" y="478" width="18" height="34" rx="2"/>
      <rect x="718" y="528" width="18" height="34" rx="2"/><rect x="746" y="528" width="18" height="34" rx="2"/>
      <rect x="718" y="578" width="18" height="34" rx="2"/><rect x="746" y="578" width="18" height="34" rx="2"/>
    </g>
    <path d="M 596 430 L 668 288 L 700 300 L 700 645 L 596 645 Z" fill="url(#towerDark)"/>
    <path d="M 668 288 L 700 300 L 700 645 L 668 645 Z" fill="#0d180f" opacity=".5"/>
    <path d="M 512 492 L 596 452 L 596 645 L 512 645 Z" fill="url(#towerMid)"/>
    <path d="M 528 506 L 584 480 L 584 645 L 528 645 Z" fill="#ffffff" opacity=".9"/>
    <path d="M 542 518 L 572 504 L 572 645 L 542 645 Z" fill="url(#towerDark)"/>
  </g>

  <!-- склиз (сгонка) -->
  <g>
    <rect x="385" y="503" width="234" height="34" rx="16" fill="url(#handle)" transform="rotate(37.1 385 520)"/>
    <rect x="399" y="512" width="206" height="10" rx="5" fill="#5fc98c" opacity=".5" transform="rotate(37.1 385 520)"/>
    <rect x="452" y="573" width="204" height="30" rx="14" fill="url(#handle)" transform="rotate(114 452 588)"/>
  </g>

  <!-- ==== ТЕКСТ ==== -->
  <g font-family="'Arial Black','Arial Bold',Arial,Helvetica,sans-serif" text-anchor="middle">
    <text x="625" y="890" font-size="74" font-weight="900" fill="#152318" letter-spacing="1">СПЕЦИАЛИЗИРОВАННЫЙ</text>
    <text x="637" y="968" font-size="56" font-weight="700" fill="#2f9e5b" letter-spacing="26">КЛИНИНГ</text>
  </g>
  <g stroke="#2f9e5b" stroke-width="4" stroke-linecap="round">
    <line x1="128" y1="950" x2="372" y2="950"/>
    <line x1="878" y1="950" x2="1122" y2="950"/>
  </g>
</svg>
