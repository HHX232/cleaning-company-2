name: Notify Telegram
description: Отправляет сообщение о статусе деплоя в Telegram
inputs:
  bot-token:
    required: true
  chat-id:
    required: true
  status:
    required: true          # "success" | "failure"
  extra-line:
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        if [ "${{ inputs.status }}" = "success" ]; then
          ICON="✅"
          TITLE="Деплой прошёл успешно"
        else
          ICON="❌"
          TITLE="Деплой упал"
        fi
        TEXT="${ICON} <b>${TITLE}</b>%0A<b>Репозиторий:</b> ${{ github.repository }}%0A<b>Коммит:</b> <code>${{ github.sha }}</code>%0A<b>Автор:</b> ${{ github.actor }}%0A${{ inputs.extra-line }}%0A<a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">Открыть лог workflow</a>"
        curl -s -X POST "https://api.telegram.org/bot${{ inputs.bot-token }}/sendMessage" \
          -d chat_id="${{ inputs.chat-id }}" \
          -d parse_mode="HTML" \
          -d disable_web_page_preview="true" \
          -d text="${TEXT}" > /dev/null
