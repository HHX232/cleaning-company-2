name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible sshpass
          ansible --version

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          if ! ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null 2>&1; then
            echo "❌ Invalid SSH private key"
            exit 1
          fi

          ssh-keyscan -H 87.232.67.175 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Test SSH connection
        run: |
          ssh -o ConnectTimeout=10 -o BatchMode=yes root@87.232.67.175 "echo '✅ SSH connection successful'"

      - name: Run Ansible playbook
        run: |
          echo "${{ secrets.VAULT_PASS }}" > /tmp/vault_pass
          chmod 600 /tmp/vault_pass

          ansible-playbook \
            -i deploy/ansible/inventory.yml \
            deploy/ansible/playbook.yml \
            --vault-password-file /tmp/vault_pass \
            -vv
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
