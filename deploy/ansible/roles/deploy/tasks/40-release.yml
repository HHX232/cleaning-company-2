---
# Next.js standalone-сервер по документации НЕ копирует public/ и .next/static/
# сам — это официально задокументированное поведение (ожидается, что этим
# займётся CDN или деплой-скрипт). Собственно наш баг с 404 живёт именно тут:
# на part этого шага полагается вся раздача статики.

- name: Copy static assets into standalone (.next/static)
  ansible.builtin.copy:
    src: "{{ release_path }}/.next/static/"
    dest: "{{ release_path }}/.next/standalone/.next/static/"
    remote_src: true
    mode: preserve
  become_user: dev

- name: Copy public/ into standalone
  ansible.builtin.copy:
    src: "{{ release_path }}/public/"
    dest: "{{ release_path }}/.next/standalone/public/"
    remote_src: true
    mode: preserve
  become_user: dev

- name: Symlink .env into standalone (не копия — единый источник правды)
  ansible.builtin.file:
    src: "{{ release_path }}/.env"
    dest: "{{ release_path }}/.next/standalone/.env"
    state: link
    force: true

- name: Symlink prisma/ into standalone (сохраняет живую ссылку на shared SQLite db)
  ansible.builtin.file:
    src: "{{ release_path }}/prisma"
    dest: "{{ release_path }}/.next/standalone/prisma"
    state: link
    force: true
  # ПРЕЖДЕ здесь стоял ansible.builtin.copy с remote_src: true — то есть
  # dev.db физически КОПИРОВАЛСЯ внутрь standalone на момент сборки.
  # Рантайм-процесс работал с этой копией, а не с "живой" базой из shared/,
  # поэтому данные, записанные приложением, терялись при следующем деплое
  # (новая копия базы бралась заново из момента сборки, откатывая изменения).

- name: Deploy ecosystem.config.js for this release
  ansible.builtin.template:
    src: ecosystem.config.js.j2
    dest: "{{ release_path }}/.next/standalone/ecosystem.config.js"
    mode: "0644"
  become_user: dev

- name: Fix ownership for the whole release
  ansible.builtin.file:
    path: "{{ release_path }}"
    owner: dev
    group: dev
    recurse: true
    state: directory

- name: Read current 'current' symlink target (for potential quick diagnostics)
  ansible.builtin.stat:
    path: "{{ app_dir }}/current"
  register: current_symlink_before

- name: Atomically switch 'current' symlink to new release
  ansible.builtin.file:
    src: "{{ release_path }}"
    dest: "{{ app_dir }}/current"
    state: link
    force: true
    owner: dev
    group: dev
  # ansible.builtin.file с state=link создаёт новый symlink во временный файл
  # и делает rename() — это атомарная операция на уровне файловой системы,
  # поэтому nginx/PM2 никогда не увидят "наполовину обновлённую" директорию.
