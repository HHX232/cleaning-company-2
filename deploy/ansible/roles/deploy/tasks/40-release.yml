---
- name: Deploy ecosystem.config.js for this release (секреты — только тут, не в файлах на диске в открытом виде)
  ansible.builtin.template:
    src: ecosystem.config.js.j2
    dest: "{{ release_path }}/app/ecosystem.config.js"
    owner: dev
    group: dev
    mode: "0600"

- name: Fix ownership for the whole release
  ansible.builtin.file:
    path: "{{ release_path }}"
    owner: dev
    group: dev
    recurse: true
    state: directory

- name: Atomically switch 'current' symlink to new release
  ansible.builtin.file:
    src: "{{ release_path }}"
    dest: "{{ app_dir }}/current"
    state: link
    force: true
    owner: dev
    group: dev
  # rename() атомарен — nginx/PM2 никогда не видят наполовину обновлённую директорию.
