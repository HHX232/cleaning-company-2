---
- name: Install system dependencies (git, nginx, curl, gnupg)
  ansible.builtin.apt:
    name: [git, nginx, curl, gnupg]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Check current Node.js major version (idempotency guard)
  ansible.builtin.command: node -v
  register: node_version_check
  changed_when: false
  failed_when: false

- name: Add Node.js APT repository
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -fsSL https://deb.nodesource.com/setup_{{ nodejs_version }}.x | bash -
    executable: /bin/bash
  when: >
    node_version_check.rc != 0 or
    ('v' ~ nodejs_version) not in node_version_check.stdout

- name: Install/upgrade Node.js
  ansible.builtin.apt:
    name: nodejs
    state: latest
    update_cache: true
  when: >
    node_version_check.rc != 0 or
    ('v' ~ nodejs_version) not in node_version_check.stdout

- name: Install PM2 globally via npm
  community.general.npm:
    name: pm2
    global: true
    state: present
