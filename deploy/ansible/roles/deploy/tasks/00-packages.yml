---
# git и build-тулчейн больше НЕ нужны на сервере: код собирается на
# GitHub Actions раннере, сюда приезжает уже готовый standalone-артефакт.
# Это заодно освобождает и диск (не нужен .git, полный node_modules,
# npm-кэш), и память (никогда больше не запускаем next build при 350МБ
# свободной RAM).

- name: Install system dependencies (curl, gnupg, nginx, tar)
  ansible.builtin.apt:
    name: [curl, gnupg, nginx, tar]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Check current Node.js major version
  ansible.builtin.command: node -v
  register: node_version_check
  changed_when: false
  failed_when: false

- name: Add Node.js APT repository
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -fsSL https://deb.nodesource.com/setup_{{ nodejs_version }}.x | bash -
    executable: /bin/bash
  when: >
    node_version_check.rc != 0 or
    ('v' ~ nodejs_version) not in node_version_check.stdout

- name: Install/upgrade Node.js runtime (нужен только чтобы ЗАПУСКАТЬ node)
  ansible.builtin.apt:
    name: nodejs
    state: latest
    update_cache: true
  when: >
    node_version_check.rc != 0 or
    ('v' ~ nodejs_version) not in node_version_check.stdout

- name: Install PM2 globally via npm
  community.general.npm:
    name: pm2
    global: true
    state: present
