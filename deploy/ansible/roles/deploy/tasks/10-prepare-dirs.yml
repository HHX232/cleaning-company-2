---
- name: Set release timestamp
  ansible.builtin.set_fact:
    release_timestamp: "{{ ansible_date_time.iso8601_basic_short }}"

- name: Set release_path fact
  ansible.builtin.set_fact:
    release_path: "{{ app_dir }}/releases/{{ release_timestamp }}"

- name: Create base directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: dev
    group: dev
    mode: "0755"
  loop:
    - "{{ app_dir }}"
    - "{{ app_dir }}/shared"
    - "{{ app_dir }}/shared/prisma"
    - "{{ app_dir }}/releases"
  # Секреты (DATABASE_URL, NEXTAUTH_SECRET, ключи S3) больше не хранятся в
  # .env-файле на сервере — они приходят из vars/vault.yml прямо в
  # ecosystem.config.js на этапе релиза. Это убирает необходимость
  # синхронизировать/симлинкать .env между release-директориями.
