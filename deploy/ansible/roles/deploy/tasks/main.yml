- name: Remove conflicting NodeSource files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/nodesource.list
    - /etc/apt/sources.list.d/nodesource.sources
    - /etc/apt/sources.list.d/nodesource.list.save
    - /etc/apt/keyrings/nodesource.gpg

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Install system dependencies
  ansible.builtin.apt:
    name:
      - git
      - nginx
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Download and dearmor NodeSource GPG key
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
    executable: /bin/bash
    creates: /etc/apt/keyrings/nodesource.gpg

- name: Add Node.js APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_{{ nodejs_version }}.x nodistro main"
    state: present
    filename: nodesource

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

- name: Install PM2 globally via npm
  community.general.npm:
    name: pm2
    global: true
    state: present

- name: Clone or update repository
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ app_dir }}"
    version: "{{ branch }}"
    force: true
  register: git_result

- name: Create .env from template
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ app_dir }}/.env"
    mode: "0600"
    owner: dev
    group: dev

- name: Install npm dependencies
  community.general.npm:
    path: "{{ app_dir }}"
    ci: true

- name: Run Prisma migrations
  ansible.builtin.command:
    cmd: npx prisma migrate deploy
    chdir: "{{ app_dir }}"
  when: git_result.changed

- name: Generate Prisma client
  ansible.builtin.command:
    cmd: npx prisma generate
    chdir: "{{ app_dir }}"
  when: git_result.changed

- name: Check if SQLite DB exists
  ansible.builtin.stat:
    path: "{{ app_dir }}/prisma/dev.db"
  register: sqlite_db

- name: Seed database
  ansible.builtin.command:
    cmd: npx prisma db seed
    chdir: "{{ app_dir }}"
  when: not sqlite_db.stat.exists

- name: Build Next.js application
  ansible.builtin.command:
    cmd: npm run build
    chdir: "{{ app_dir }}"
  environment:
    NODE_OPTIONS: "--max-old-space-size=768"
  when: git_result.changed

- name: Copy static assets to standalone
  ansible.builtin.copy:
    src: "{{ app_dir }}/.next/static"
    dest: "{{ app_dir }}/.next/standalone/.next/"
    remote_src: true
    mode: preserve

- name: Copy public folder to standalone
  ansible.builtin.copy:
    src: "{{ app_dir }}/public"
    dest: "{{ app_dir }}/.next/standalone/"
    remote_src: true
    mode: preserve

- name: Copy .env into standalone
  ansible.builtin.copy:
    src: "{{ app_dir }}/.env"
    dest: "{{ app_dir }}/.next/standalone/.env"
    remote_src: true
    mode: "0600"

- name: Copy prisma folder into standalone
  ansible.builtin.copy:
    src: "{{ app_dir }}/prisma"
    dest: "{{ app_dir }}/.next/standalone/"
    remote_src: true
    mode: preserve

- name: Fix ownership for application files
  ansible.builtin.file:
    path: "{{ app_dir }}"
    owner: dev
    group: dev
    recurse: true

- name: Check PM2 process state
  ansible.builtin.command:
    cmd: pm2 show cleaning
  register: pm2_status
  failed_when: false
  changed_when: false
  become: true
  become_user: dev

- name: Start application via PM2
  ansible.builtin.command:
    cmd: pm2 start .next/standalone/server.js --name cleaning --node-args="--max-old-space-size=768"
    chdir: "{{ app_dir }}"
  become: true
  become_user: dev
  when: pm2_status.rc != 0

- name: Restart application via PM2
  ansible.builtin.command:
    cmd: pm2 restart cleaning --update-env
    chdir: "{{ app_dir }}"
  become: true
  become_user: dev
  when: pm2_status.rc == 0 and git_result.changed

- name: Save PM2 state
  ansible.builtin.command:
    cmd: pm2 save
  become: true
  become_user: dev
  changed_when: false

- name: Enable PM2 startup script
  ansible.builtin.command:
    cmd: pm2 startup systemd -u dev --hp /home/dev
    creates: /etc/systemd/system/pm2-dev.service

- name: Deploy nginx config
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/{{ domain_name }}
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/{{ domain_name }}
    dest: /etc/nginx/sites-enabled/{{ domain_name }}
    state: link
  notify: Reload nginx

- name: Remove default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx
