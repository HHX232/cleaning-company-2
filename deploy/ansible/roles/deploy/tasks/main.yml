---
- name: Ensure system packages are installed
  ansible.builtin.apt:
    name:
      - nginx
      - curl
      - git
      - build-essential
      - python3
      - python3-apt
    state: present
    update_cache: true
  become: true

- name: Install Node.js {{ nodejs_version }} from NodeSource
  ansible.builtin.shell:
    cmd: |
      curl -fsSL {{ nodejs_install_script }} | bash -
      apt-get install -y nodejs
    creates: /usr/bin/node
  become: true

- name: Install PM2 globally
  ansible.builtin.npm:
    name: pm2
    global: true
    state: present
  become: true

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  become: true

- name: Clone or update repository
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ app_dir }}"
    version: "{{ branch }}"
    force: true
    depth: 1
  become_user: "{{ ansible_user }}"
  become: true
  register: git_result

- name: Create .env from template
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ app_dir }}/.env"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  become: true
  no_log: true

- name: Install npm dependencies
  ansible.builtin.command:
    cmd: npm ci
    chdir: "{{ app_dir }}"
  become_user: "{{ ansible_user }}"
  become: true
  register: npm_install
  changed_when: "'added' in npm_install.stdout"

- name: Ensure prisma directory exists
  ansible.builtin.file:
    path: "{{ app_dir }}/prisma"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  become_user: "{{ ansible_user }}"
  become: true

- name: Create database schema with prisma db push
  ansible.builtin.command:
    cmd: npx prisma db push --skip-generate
    chdir: "{{ app_dir }}"
  become_user: "{{ ansible_user }}"
  become: true
  register: db_push
  changed_when: "'Database is up to date' not in db_push.stdout"
  failed_when: db_push.rc != 0

- name: Seed database
  ansible.builtin.command:
    cmd: npm run seed
    chdir: "{{ app_dir }}"
  become_user: "{{ ansible_user }}"
  become: true
  register: seed_result
  changed_when: "'Seeded' in seed_result.stdout"
  failed_when: seed_result.rc != 0

- name: Build Next.js application
  ansible.builtin.command:
    cmd: npm run build
    chdir: "{{ app_dir }}"
  become_user: "{{ ansible_user }}"
  become: true
  register: build_result
  changed_when: "'Compiled successfully' in build_result.stdout"

- name: Ensure static files are copied to standalone output
  ansible.builtin.command:
    cmd: cp -r {{ app_dir }}/public {{ app_dir }}/.next/standalone/
  become_user: "{{ ansible_user }}"
  become: true
  register: copy_public
  changed_when: copy_public.rc == 0

- name: Deploy nginx site configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "/etc/nginx/sites-available/{{ app_name }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload nginx

- name: Enable nginx site
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ app_name }}"
    dest: "/etc/nginx/sites-enabled/{{ app_name }}"
    state: link
  become: true
  notify: Reload nginx

- name: Create PM2 ecosystem file
  ansible.builtin.template:
    src: ecosystem.config.js.j2
    dest: "{{ app_dir }}/ecosystem.config.js"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  become: true

- name: Fix permissions for application files
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
    recurse: true
  become: true

- name: Start or restart application via PM2
  ansible.builtin.command:
    cmd: pm2 startOrRestart {{ app_dir }}/ecosystem.config.js
  become_user: "{{ ansible_user }}"
  become: true
  register: pm2_result
  changed_when: "'restart' in pm2_result.stdout or 'start' in pm2_result.stdout"

- name: Save PM2 process list for auto-restart
  ansible.builtin.command:
    cmd: pm2 save
  become_user: "{{ ansible_user }}"
  become: true
  changed_when: false
