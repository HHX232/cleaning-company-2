---
- name: Check if PM2 process 'cleaning' already exists
  ansible.builtin.command: pm2 id cleaning
  register: pm2_id_check
  become_user: dev
  changed_when: false
  failed_when: false

- name: Start app via PM2 (first deploy)
  ansible.builtin.command: pm2 start {{ app_dir }}/current/ecosystem.config.js
  become_user: dev
  when: pm2_id_check.rc != 0
  changed_when: true

# ВАЖНО: `pm2 reload cleaning` (по имени) обновит только env, но НЕ
# script/cwd — процесс продолжит работать со старым release_path.
# Чтобы PM2 подхватил новый релиз, reload нужно вызывать с путём к
# СВЕЖЕМУ ecosystem-файлу (через актуальный symlink current).
- name: Reload app via PM2 (graceful, picks up new release path)
  ansible.builtin.command: pm2 reload {{ app_dir }}/current/ecosystem.config.js --update-env
  become_user: dev
  when: pm2_id_check.rc == 0
  changed_when: true

- name: Save PM2 process list
  ansible.builtin.command: pm2 save
  become_user: dev
  changed_when: true

- name: Enable PM2 startup script (idempotent)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      pm2 startup systemd -u dev --hp /home/dev | tail -n1 | bash
    executable: /bin/bash
  args:
    creates: /etc/systemd/system/pm2-dev.service
