---
# ВАЖНО: в исходном проекте существовало два файла main.yml с частично
# пересекающимся содержимым — один с полным набором задач (git/npm/build/pm2/nginx),
# второй содержал только "Reload nginx" + "Copy static assets to standalone".
# Похоже на то, что второй файл по ошибке использовался/редактировался как
# handlers/main.yml, но в handlers копирование статики никогда корректно
# не отработает: handler запускается только когда его ИМЯ указано в `notify:`,
# а "Copy static assets to standalone" нигде не нотифайдился — то есть
# этот код в handlers был мёртвым и никогда не выполнялся оттуда.
# Здесь handlers намеренно оставлены минимальными: только то, что
# действительно должно запускаться "по требованию" (notify) после
# изменения состояния (deploy-конфига nginx).

- name: Reload nginx
  ansible.builtin.systemd:
    name: nginx
    state: reloaded
