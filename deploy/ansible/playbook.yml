- name: Deploy prebuilt Next.js artifact (releases model, zero-downtime)
  hosts: cleaning-server
  become: true
  gather_facts: true
  roles:
    - deploy
  vars_files:
    - vars/vault.yml
  vars:
    app_dir: /opt/cleaning
    nodejs_version: "20"
    app_port: 3000
    pm2_instances: 1
    keep_releases: 2
    min_free_mb: 700
    domain_name: "xn----7sbahhhpgbbdakphi4aafbjo4ap1k6f.xn--90ais"
    release_tarball: "{{ release_tarball | default('') }}"
