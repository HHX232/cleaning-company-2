---
# Быстрый откат: ansible-playbook rollback.yml -i inventory.yml
# Переключает symlink current на предыдущий релиз и делает pm2 reload.
# Ничего не собирает и не тянет из git — поэтому выполняется за секунды.
- name: Rollback to previous release
  hosts: cleaning-server
  become: true
  vars:
    app_dir: /opt/cleaning
  tasks:
    - name: List existing releases (sorted)
      ansible.builtin.find:
        paths: "{{ app_dir }}/releases"
        file_type: directory
      register: releases_found

    - name: Fail if fewer than 2 releases exist
      ansible.builtin.fail:
        msg: "Недостаточно релизов для отката (нужно минимум 2, найдено {{ releases_found.files | length }})"
      when: releases_found.files | length < 2

    - name: Sort releases by name (timestamp) descending
      ansible.builtin.set_fact:
        sorted_releases: "{{ releases_found.files | map(attribute='path') | sort | reverse | list }}"

    - name: Determine previous release (second newest)
      ansible.builtin.set_fact:
        previous_release: "{{ sorted_releases[1] }}"

    - name: Show rollback target
      ansible.builtin.debug:
        msg: "Откатываемся на {{ previous_release }}"

    - name: Point 'current' symlink at previous release (atomic)
      ansible.builtin.file:
        src: "{{ previous_release }}"
        dest: "{{ app_dir }}/current"
        state: link
        force: true

    - name: Reload app via PM2
      ansible.builtin.command: pm2 reload cleaning --update-env
      changed_when: true

    - name: Smoke test after rollback
      ansible.builtin.uri:
        url: "http://127.0.0.1:3000/"
        status_code: 200
      retries: 5
      delay: 2
      register: rollback_check
      until: rollback_check.status == 200
